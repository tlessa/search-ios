<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Liquid Glass iOS Wireframe</title>

		<!-- Tailwind via CDN for quick prototyping/wireframing -->
		<script src="https://cdn.tailwindcss.com"></script>

		<style>
			/*
				Design tokens pulled from the selected Figma frame.
				Keeping them in CSS variables makes future theming easier.
			*/
			:root {
				--ios-gray-100: #f8f9fa;
				--ios-gray-300: #c8ccd1;
				--ios-gray-500: #72777d;
				--ios-gray-600: #54595d;
				--ios-gray-700: #202122;
				--ios-white: #ffffff;
				--ios-progressive: #3366cc;
			}

			/* Soft page background to support glass contrast */
			body {
				min-height: 100dvh;
				background: radial-gradient(circle at 20% -10%, #ffffff 0%, #f0f1f3 45%, #e8eaee 100%);
				color: var(--ios-gray-700);
				font-family: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
			}

			/* Reusable liquid-glass style used for top and bottom bars */
			.liquid-glass {
				background: rgba(255, 255, 255, 0.56);
				border: 1px solid rgba(255, 255, 255, 0.7);
				box-shadow: 0 10px 24px rgba(32, 33, 34, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.65);
				backdrop-filter: blur(18px) saturate(140%);
				-webkit-backdrop-filter: blur(18px) saturate(140%);
			}

			/*
				Soft scroll-edge effect (web equivalent of iOS liquid-glass edge behavior).
				These sticky layers stay at the scroll boundaries where content underlaps UI.
			*/
			.scroll-edge-soft-top,
			.scroll-edge-soft-bottom {
				position: sticky;
				left: 0;
				right: 0;
				height: 108px;
				z-index: 10;
				pointer-events: none;
				backdrop-filter: blur(8px) saturate(120%);
				-webkit-backdrop-filter: blur(8px) saturate(120%);
			}

			.scroll-edge-soft-top {
				height: 78px;
				top: 0;
				margin-bottom: -78px;
				background: linear-gradient(to bottom, rgba(248, 249, 250, 0.22) 0%, rgba(248, 249, 250, 0.08) 55%, rgba(248, 249, 250, 0) 100%);
				mask-image: linear-gradient(to bottom, #000 0%, #000 60%, transparent 100%);
				-webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 60%, transparent 100%);
			}

			.scroll-edge-soft-bottom {
				bottom: 0;
				margin-top: -78px;
				background: linear-gradient(to top, rgba(248, 249, 250, 0.22) 0%, rgba(248, 249, 250, 0.08) 55%, rgba(248, 249, 250, 0) 100%);
				mask-image: linear-gradient(to top, #000 0%, #000 60%, transparent 100%);
				-webkit-mask-image: linear-gradient(to top, #000 0%, #000 60%, transparent 100%);
			}

			/* Prevent horizontal scrolling from full article HTML content */
			#wiki-article,
			#wiki-body {
				overflow-x: hidden;
			}

			#wiki-body * {
				max-width: 100%;
				box-sizing: border-box;
				overflow-wrap: anywhere;
			}

			#wiki-body table {
				width: 100% !important;
				table-layout: fixed;
			}

			/* ── Search view ──────────────────────────────────────── */
			#search-nav-row {
				display: none;
			}

			body.search-view-active #primary-nav-row {
				display: none;
			}

			body.search-view-active #search-nav-row {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}

			body.search-view-active #wiki-article {
				display: none;
			}

			body.search-view-active #search-history-screen {
				display: block;
			}

			body.search-view-active footer {
				display: none;
			}

			#search-history-screen {
				display: none;
			}

			/* Typing mode: hide title row, expand field to full width */
			#search-top-row {
				transition: opacity 180ms ease;
			}

			body.search-typing #search-top-row {
				display: none;
			}

			#search-cancel-btn {
				display: none;
				flex-shrink: 0;
			}

			body.search-typing #search-cancel-btn {
				display: grid;
			}
		</style>
	</head>

	<body>

		<script>
			// ── Wikipedia URL helpers ────────────────────────────────
			function normalizeWikipediaUrl(rawUrl) {
				if (!rawUrl) return rawUrl;
				if (rawUrl.startsWith("//")) return `https:${rawUrl}`;
				if (rawUrl.startsWith("./")) return `https://en.wikipedia.org/wiki/${rawUrl.slice(2)}`;
				if (rawUrl.startsWith("/")) return `https://en.wikipedia.org${rawUrl}`;
				return rawUrl;
			}

			async function resolveWikipediaTopic(query) {
				const trimmedQuery = query.trim();
				if (!trimmedQuery) return "Cactus";
				const endpoint = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(trimmedQuery)}&utf8=1&format=json&origin=*`;
				try {
					const response = await fetch(endpoint, { headers: { accept: "application/json" } });
					if (!response.ok) return trimmedQuery;
					const data = await response.json();
					return data?.query?.search?.[0]?.title || trimmedQuery;
				} catch {
					return trimmedQuery;
				}
			}

			// ── Article loader ───────────────────────────────────────
			async function loadWikipediaSummary(topic) {
				const safeTopic = encodeURIComponent(topic.trim() || "Cactus");
				const summaryEndpoint = `https://en.wikipedia.org/api/rest_v1/page/summary/${safeTopic}`;
				const htmlEndpoint = `https://en.wikipedia.org/api/rest_v1/page/html/${safeTopic}`;

				const heroEl = document.getElementById("wiki-hero");
				const titleEl = document.getElementById("wiki-title");
				const descEl = document.getElementById("wiki-description");
				const bodyEl = document.getElementById("wiki-body");

				titleEl.textContent = "Loading...";
				descEl.textContent = "Fetching article...";
				bodyEl.innerHTML = "<p>Loading article content...</p>";

				try {
					const [summaryResponse, htmlResponse] = await Promise.all([
						fetch(summaryEndpoint, { headers: { accept: "application/json" } }),
						fetch(htmlEndpoint, { headers: { accept: "text/html" } }),
					]);

					if (!summaryResponse.ok) throw new Error(`Wikipedia request failed with ${summaryResponse.status}`);
					if (!htmlResponse.ok) throw new Error(`Wikipedia article HTML request failed with ${htmlResponse.status}`);

					const [data, htmlText] = await Promise.all([summaryResponse.json(), htmlResponse.text()]);
					const image = data.originalimage?.source || data.thumbnail?.source || "hero-crop.png";

					heroEl.style.backgroundImage = `url('${image}')`;
					titleEl.textContent = data.title || "Cactus";
					descEl.textContent = data.description || "Wikipedia article";

					const parser = new DOMParser();
					const htmlDoc = parser.parseFromString(htmlText, "text/html");
					const root = htmlDoc.body || htmlDoc;
					root.querySelectorAll("script, style, .mw-editsection").forEach((el) => el.remove());
					root.querySelectorAll("a[href]").forEach((link) => {
						const href = link.getAttribute("href");
						if (href) link.setAttribute("href", normalizeWikipediaUrl(href));
						link.setAttribute("target", "_blank");
						link.setAttribute("rel", "noopener noreferrer");
					});
					root.querySelectorAll("img[src]").forEach((img) => {
						const src = img.getAttribute("src");
						if (src) img.setAttribute("src", normalizeWikipediaUrl(src));
						img.setAttribute("loading", "lazy");
						img.style.maxWidth = "100%";
						img.style.height = "auto";
					});
					bodyEl.innerHTML = root.innerHTML || "<p>No article content available.</p>";
				} catch (error) {
					titleEl.textContent = "Unable to load article";
					descEl.textContent = "Please try again.";
					bodyEl.innerHTML = `<p>${error.message}</p>`;
					heroEl.style.backgroundImage = "url('hero-crop.png')";
				}
			}

			// ── DOM refs ─────────────────────────────────────────────
			const articleEl = document.getElementById("wiki-article");
			const primaryNavRowEl = document.getElementById("primary-nav-row");
			const wikiSearchInputEl = document.getElementById("wiki-search");
			let lastScrollTop = 0;

			// ── Search history ───────────────────────────────────────
			let searchHistory = [];
			let predictedSearchResults = [];
			let predictionRequestToken = 0;
			let predictionDebounceTimer = null;
			const placeholderSearchHistory = [
				{
					query: "Saturn rings",
					title: "Saturn",
					description: "Gas giant of the outer Solar System, known for its prominent ring system.",
					thumbnail: "https://picsum.photos/seed/saturn-template/120/120",
					timestamp: Date.now() - 1000 * 60 * 22,
				},
				{
					query: "Frida Kahlo",
					title: "Frida Kahlo",
					description: "Mexican painter known for self-portraits and works inspired by nature and culture.",
					thumbnail: "https://picsum.photos/seed/frida-template/120/120",
					timestamp: Date.now() - 1000 * 60 * 60 * 7,
				},
				{
					query: "Kyoto temples",
					title: "Kyoto",
					description: "Historic city in Japan famous for temples, shrines, and traditional districts.",
					thumbnail: "https://picsum.photos/seed/kyoto-template/120/120",
					timestamp: Date.now() - 1000 * 60 * 60 * 30,
				},
			];
			try { searchHistory = JSON.parse(sessionStorage.getItem("wikiSearchHistory") || "[]"); } catch (_) {}
			if (!Array.isArray(searchHistory) || searchHistory.length === 0) {
				searchHistory = placeholderSearchHistory.map((entry) => ({ ...entry }));
				saveSearchHistory();
			}
			const templateThumbnailByQuery = {
				"Saturn rings": "https://picsum.photos/seed/saturn-template/120/120",
				"Frida Kahlo": "https://picsum.photos/seed/frida-template/120/120",
				"Kyoto temples": "https://picsum.photos/seed/kyoto-template/120/120",
			};
			let seededHistoryUpdated = false;
			searchHistory = searchHistory.map((entry) => {
				const thumb = templateThumbnailByQuery[entry?.query || ""];
				if (!thumb || entry?.thumbnail) return entry;
				seededHistoryUpdated = true;
				return { ...entry, thumbnail: thumb };
			});
			if (seededHistoryUpdated) saveSearchHistory();

			function saveSearchHistory() {
				try { sessionStorage.setItem("wikiSearchHistory", JSON.stringify(searchHistory)); } catch (_) {}
			}

			function addToSearchHistory(query, title, description, thumbnail) {
				searchHistory = searchHistory.filter((e) => e.query !== query);
				searchHistory.unshift({ query, title, description, thumbnail, timestamp: Date.now() });
				if (searchHistory.length > 50) searchHistory = searchHistory.slice(0, 50);
				saveSearchHistory();
			}

			function formatHistoryDateLabel(timestamp) {
				const now = new Date();
				const d = new Date(timestamp);
				const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
				const entry = new Date(d.getFullYear(), d.getMonth(), d.getDate());
				const diff = Math.round((today - entry) / 86400000);
				if (diff === 0) return "Today";
				if (diff === 1) return "Yesterday";
				return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
			}

			async function fetchWikipediaPredictions(query) {
				const trimmedQuery = query.trim();
				if (!trimmedQuery) return [];
				const endpoint = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(trimmedQuery)}&gsrlimit=8&gsrprop=snippet&prop=pageimages&piprop=thumbnail&pithumbsize=104&pilimit=8&utf8=1&format=json&formatversion=2&origin=*`;
				const response = await fetch(endpoint, { headers: { accept: "application/json" } });
				if (!response.ok) throw new Error(`Wikipedia prediction request failed with ${response.status}`);
				const data = await response.json();
				const pages = data?.query?.pages || [];
				return [...pages].sort((a, b) => (a.index || 0) - (b.index || 0)).map((entry) => ({
					title: entry.title,
					description: (entry.snippet || "").replace(/<[^>]+>/g, "").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&").trim(),
					thumbnail: entry.thumbnail?.source || null,
				}));
			}

			function requestSearchPredictions(query) {
				if (predictionDebounceTimer) clearTimeout(predictionDebounceTimer);
				const trimmedQuery = query.trim();
				if (!trimmedQuery) {
					predictedSearchResults = [];
					if (document.body.classList.contains("search-typing")) renderSearchHistory(true);
					return;
				}
				predictionDebounceTimer = setTimeout(async () => {
					const token = ++predictionRequestToken;
					try {
						const results = await fetchWikipediaPredictions(trimmedQuery);
						if (token !== predictionRequestToken) return;
						predictedSearchResults = results;
					} catch {
						if (token !== predictionRequestToken) return;
						predictedSearchResults = [];
					}
					if (document.body.classList.contains("search-typing")) renderSearchHistory(true);
				}, 180);
			}

			async function openArticleFromSearchSelection(topic, rawQuery = "", fallbackDescription = "") {
				const normalizedTopic = (topic || "").trim();
				if (!normalizedTopic) return;
				if (wikiSearchInputEl) wikiSearchInputEl.value = "";
				predictedSearchResults = [];
				setSearchViewActive(false);
				await loadWikipediaSummary(normalizedTopic);
				const titleEl = document.getElementById("wiki-title");
				const descEl = document.getElementById("wiki-description");
				const heroEl = document.getElementById("wiki-hero");
				const bgMatch = (heroEl?.style.backgroundImage || "").match(/url\(['"]?([^'"]+)['"]?\)/);
				addToSearchHistory(rawQuery || normalizedTopic, titleEl?.textContent || normalizedTopic, descEl?.textContent || fallbackDescription || "", bgMatch ? bgMatch[1] : null);
				if (articleEl) articleEl.scrollTo({ top: 0, behavior: "smooth" });
				if (primaryNavRowEl) primaryNavRowEl.classList.remove("-translate-y-4", "opacity-0", "pointer-events-none");
				lastScrollTop = 0;
			}

			function renderSearchHistory(queryMode = false) {
				const listEl = document.getElementById("search-history-list");
				const headingEl = document.querySelector("#search-history-screen h2");
				if (!listEl) return;

				if (headingEl) {
					headingEl.textContent = queryMode ? "Recent searches" : "History";
					headingEl.style.display = "";
				}

				if (queryMode) {
					const currentQuery = wikiSearchInputEl ? wikiSearchInputEl.value.trim() : "";
					if (headingEl && currentQuery) headingEl.style.display = "none";
					if (currentQuery) {
						if (predictedSearchResults.length === 0) {
							listEl.innerHTML = '<p class="text-[15px] text-[var(--ios-gray-500)]">No matching Wikipedia articles.</p>';
							return;
						}
						let html = "";
						for (const result of predictedSearchResults) {
							const safeTitle = result.title.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
							const safeDescription = (result.description || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
							const thumb = result.thumbnail
								? `<img src="${result.thumbnail}" alt="" class="h-[52px] w-[52px] shrink-0 rounded-[10px] object-cover" loading="lazy" />`
								: `<div class="h-[52px] w-[52px] shrink-0 rounded-[10px] bg-[var(--ios-gray-300)]"></div>`;
							html += `<button class="prediction-entry flex w-full items-center gap-3 border-b border-[var(--ios-gray-300)] py-3 text-left" data-title="${safeTitle}" data-description="${safeDescription}">
								<div class="min-w-0 flex-1">
									<p class="text-[16px] font-medium leading-snug text-[var(--ios-gray-700)]">${result.title}</p>
									<p class="truncate text-[13px] text-[var(--ios-gray-500)]">${result.description || "Wikipedia article"}</p>
								</div>
								${thumb}
							</button>`;
						}
						listEl.innerHTML = html;
						listEl.querySelectorAll(".prediction-entry").forEach((btn) => {
							btn.addEventListener("click", () => {
								const title = btn.getAttribute("data-title") || "";
								const description = btn.getAttribute("data-description") || "";
								const typedQuery = wikiSearchInputEl ? wikiSearchInputEl.value.trim() : "";
								void openArticleFromSearchSelection(title, typedQuery || title, description);
							});
						});
						return;
					}
					// Empty query — show recent raw queries
					let html = "";
					for (const entry of searchHistory) {
						const safeQuery = entry.query.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
						html += `<button class="query-entry flex w-full items-center gap-3 border-b border-[var(--ios-gray-300)] py-[13px] text-left" data-query="${safeQuery}">
							<span class="text-[16px] text-[var(--ios-gray-700)]">${entry.query}</span>
						</button>`;
					}
					listEl.innerHTML = html;
					listEl.querySelectorAll(".query-entry").forEach((btn) => {
						btn.addEventListener("click", () => {
							if (wikiSearchInputEl) wikiSearchInputEl.value = btn.getAttribute("data-query");
							void submitSearch();
						});
					});
					return;
				}

				if (searchHistory.length === 0) {
					listEl.innerHTML = '<p class="text-[15px] text-[var(--ios-gray-500)]">No recent searches.</p>';
					return;
				}
				// Article-card mode — grouped by date
				const groups = [];
				const groupMap = {};
				for (const entry of searchHistory) {
					const label = formatHistoryDateLabel(entry.timestamp);
					if (!groupMap[label]) { groupMap[label] = []; groups.push({ label, entries: groupMap[label] }); }
					groupMap[label].push(entry);
				}
				let html = "";
				for (const group of groups) {
					html += `<div class="mb-2 mt-4">
						<p class="mb-1 text-[13px] font-semibold uppercase tracking-wide text-[var(--ios-gray-500)]">${group.label}</p>`;
					for (const entry of group.entries) {
						const safeTitle = (entry.title || entry.query).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
						const thumb = entry.thumbnail
							? `<img src="${entry.thumbnail}" alt="" class="h-[52px] w-[52px] shrink-0 rounded-[10px] object-cover" loading="lazy" />`
							: `<div class="h-[52px] w-[52px] shrink-0 rounded-[10px] bg-[var(--ios-gray-300)]"></div>`;
						html += `<button class="history-entry flex w-full items-center gap-3 border-b border-[var(--ios-gray-300)] py-3 text-left" data-title="${safeTitle}">
							<div class="min-w-0 flex-1">
								<p class="text-[16px] font-medium leading-snug text-[var(--ios-gray-700)]">${entry.title || entry.query}</p>
								<p class="truncate text-[13px] text-[var(--ios-gray-500)]">${entry.description || ""}</p>
							</div>
							${thumb}
						</button>`;
					}
					html += `</div>`;
				}
				listEl.innerHTML = html;
				listEl.querySelectorAll(".history-entry").forEach((btn) => {
					btn.addEventListener("click", () => {
						const title = btn.getAttribute("data-title");
						setSearchViewActive(false);
						void loadWikipediaSummary(title);
						if (articleEl) articleEl.scrollTo({ top: 0, behavior: "smooth" });
						lastScrollTop = 0;
					});
				});
			}

			function setSearchViewActive(isActive) {
				document.body.classList.toggle("search-view-active", isActive);
				if (!isActive) {
					document.body.classList.remove("search-typing");
					predictedSearchResults = [];
					predictionRequestToken += 1;
					if (predictionDebounceTimer) clearTimeout(predictionDebounceTimer);
				}
				if (wikiSearchInputEl) {
					if (isActive) {
						wikiSearchInputEl.setAttribute("readonly", "readonly");
						wikiSearchInputEl.blur();
					} else {
						wikiSearchInputEl.removeAttribute("readonly");
						wikiSearchInputEl.value = "";
					}
				}
				if (isActive) renderSearchHistory(false);
			}

			function activateSearchTypingMode() {
				if (!document.body.classList.contains("search-view-active")) return false;
				if (!document.body.classList.contains("search-typing")) {
					document.body.classList.add("search-typing");
					renderSearchHistory(true);
				}
				if (wikiSearchInputEl) {
					wikiSearchInputEl.readOnly = false;
					wikiSearchInputEl.removeAttribute("readonly");
					requestSearchPredictions(wikiSearchInputEl.value);
				}
				return true;
			}

			async function submitSearch() {
				if (!wikiSearchInputEl) return;
				const query = wikiSearchInputEl.value.trim();
				if (!query) return;
				const resolvedTopic = await resolveWikipediaTopic(query);
				wikiSearchInputEl.value = "";
				setSearchViewActive(false);
				await loadWikipediaSummary(resolvedTopic);
				const titleEl = document.getElementById("wiki-title");
				const descEl = document.getElementById("wiki-description");
				const heroEl = document.getElementById("wiki-hero");
				const bgMatch = (heroEl?.style.backgroundImage || "").match(/url\(['"]?([^'"]+)['"]?\)/);
				addToSearchHistory(query, titleEl?.textContent || resolvedTopic, descEl?.textContent || "", bgMatch ? bgMatch[1] : null);
				if (articleEl) articleEl.scrollTo({ top: 0, behavior: "smooth" });
				if (primaryNavRowEl) primaryNavRowEl.classList.remove("-translate-y-4", "opacity-0", "pointer-events-none");
				lastScrollTop = 0;
			}

			// ── Event listeners ──────────────────────────────────────
			const searchOpenBtnEl = document.getElementById("search-open-btn");
			if (searchOpenBtnEl) {
				searchOpenBtnEl.addEventListener("click", () => setSearchViewActive(true));
			}

			const searchBackBtnEl = document.getElementById("search-back-btn");
			if (searchBackBtnEl) {
				searchBackBtnEl.addEventListener("click", () => setSearchViewActive(false));
			}

			const clearHistoryBtnEl = document.getElementById("clear-history-btn");
			if (clearHistoryBtnEl) {
				clearHistoryBtnEl.addEventListener("click", () => {
					searchHistory = [];
					saveSearchHistory();
					renderSearchHistory();
				});
			}

			const searchCancelBtnEl = document.getElementById("search-cancel-btn");
			if (searchCancelBtnEl) {
				searchCancelBtnEl.addEventListener("click", () => {
					if (wikiSearchInputEl) wikiSearchInputEl.value = "";
					document.body.classList.remove("search-typing");
					predictedSearchResults = [];
					predictionRequestToken += 1;
					if (predictionDebounceTimer) clearTimeout(predictionDebounceTimer);
					renderSearchHistory(false);
				});
			}

			const searchFieldLabelEl = document.getElementById("search-field-label");
			if (searchFieldLabelEl) {
				// touchstart fires synchronously on iOS — only way to reliably trigger keyboard
				searchFieldLabelEl.addEventListener("touchstart", (e) => {
					if (!document.body.classList.contains("search-view-active")) return;
					if (wikiSearchInputEl) {
						wikiSearchInputEl.removeAttribute("readonly");
						wikiSearchInputEl.readOnly = false;
						wikiSearchInputEl.focus();
					}
					activateSearchTypingMode();
				}, { passive: true });
				searchFieldLabelEl.addEventListener("pointerdown", () => activateSearchTypingMode());
				searchFieldLabelEl.addEventListener("click", () => {
					activateSearchTypingMode();
					if (wikiSearchInputEl) wikiSearchInputEl.focus({ preventScroll: true });
				});
			}
			if (wikiSearchInputEl) {
				wikiSearchInputEl.addEventListener("touchstart", (e) => {
					if (!document.body.classList.contains("search-view-active")) return;
					wikiSearchInputEl.removeAttribute("readonly");
					wikiSearchInputEl.readOnly = false;
					wikiSearchInputEl.focus();
					activateSearchTypingMode();
				}, { passive: true });
			}

			if (wikiSearchInputEl) {
				wikiSearchInputEl.addEventListener("focus", () => activateSearchTypingMode());
				wikiSearchInputEl.addEventListener("input", () => {
					if (!document.body.classList.contains("search-view-active")) return;
					if (!document.body.classList.contains("search-typing")) activateSearchTypingMode();
					requestSearchPredictions(wikiSearchInputEl.value);
				});
				wikiSearchInputEl.addEventListener("keydown", (event) => {
					if (event.key !== "Enter") return;
					event.preventDefault();
					void submitSearch();
				});
			}

			// ── Scroll: hide/show top bar ────────────────────────────
			if (articleEl && primaryNavRowEl) {
				articleEl.addEventListener("scroll", () => {
					const currentScrollTop = articleEl.scrollTop;
					if (currentScrollTop > lastScrollTop + 4) {
						primaryNavRowEl.classList.add("-translate-y-4", "opacity-0", "pointer-events-none");
					} else if (currentScrollTop < lastScrollTop - 4) {
						primaryNavRowEl.classList.remove("-translate-y-4", "opacity-0", "pointer-events-none");
					}
					lastScrollTop = Math.max(currentScrollTop, 0);
				});
			}

			loadWikipediaSummary("Cactus");
		</script>
	</body>
</html>
